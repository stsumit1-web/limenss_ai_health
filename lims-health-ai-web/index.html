<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Limenss AI Healthcare Experience Platform — Healthcare without queues, confusion, or chaos. One AI-powered platform connecting patients, doctors, clinics, labs, pharmacies, and hospitals." />
    <title>Limenss AI Healthcare Experience Platform | LHXP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <!-- Netlify Forms: hidden form so Netlify detects it at deploy (SPA) -->
    <form name="lhxp-contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="clinicName" />
      <input type="text" name="city" />
      <input type="tel" name="contact" />
      <input type="email" name="email" />
      <input type="text" name="type" />
      <input type="text" name="enquiryType" />
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
