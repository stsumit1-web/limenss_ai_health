<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" fill="#E5ECF0"/>
  <!-- Delivery box -->
  <path d="M240 320 L400 240 L560 320 L560 440 L400 520 L240 440 Z" fill="#F8FAFA" stroke="#34A0A4" stroke-width="2"/>
  <path d="M400 240 L400 520 M240 320 L560 320" stroke="#34A0A4" stroke-width="1.5" opacity="0.6"/>
  <!-- Medical cross on box -->
  <rect x="355" y="350" width="90" height="90" rx="8" fill="#76C893" opacity="0.3"/>
  <rect x="385" y="320" width="30" height="150" fill="#34A0A4"/>
  <rect x="340" y="365" width="120" height="30" fill="#34A0A4"/>
  <!-- Medicine strips -->
  <rect x="280" y="380" width="80" height="40" rx="4" fill="#F8FAFA" stroke="#184E77" stroke-width="1"/>
  <circle cx="295" cy="400" r="6" fill="#76C893"/>
  <circle cx="325" cy="400" r="6" fill="#76C893"/>
  <circle cx="355" cy="400" r="6" fill="#76C893"/>
  <!-- Clock / 10 min -->
  <circle cx="520" cy="380" r="50" fill="#F8FAFA" stroke="#34A0A4" stroke-width="2"/>
  <text x="520" y="395" text-anchor="middle" fill="#184E77" font-size="20" font-weight="bold" font-family="system-ui,sans-serif">10</text>
  <text x="520" y="415" text-anchor="middle" fill="#34A0A4" font-size="12" font-family="system-ui,sans-serif">min</text>
  <!-- Label -->
  <text x="400" y="520" text-anchor="middle" fill="#184E77" font-size="22" font-weight="600" font-family="system-ui,sans-serif">Medicine delivery to booth</text>
</svg>
